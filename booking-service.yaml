server:
  port: 8083
  # Build links (Location header) from the Host forwarded by the gateway.
  forward-headers-strategy: framework
spring:
  datasource:
    # DB_HOST: "mysql" in docker compose, localhost otherwise.
    # Credentials come ONLY from the environment (root .env), never from this repo.
    url: jdbc:mysql://${DB_HOST:localhost}:3306/booking_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  # Producer of ticketflow.booking.created (bootstrap-servers: application.yaml).
  # Best effort: a broker outage must not fail a booking, so never wait long.
  kafka:
    producer:
      client-id: booking-service
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # send() blocks at most 2 s for metadata when the broker is down
        # (default 60 s would hold the HTTP request), then fails: logged.
        max.block.ms: 2000
        request.timeout.ms: 5000
        # Give up an unacknowledged record after 10 s (>= linger + request timeout).
        delivery.timeout.ms: 10000
  cloud:
    openfeign:
      client:
        config:
          # Fail fast: a dependency that is down or too slow gives a 503 in ~3 s.
          # No automatic retry (Feign's default Retryer.NEVER_RETRY is kept, and
          # spring-retry is not on the classpath): a POST reservation must never
          # be sent twice.
          event-service:
            connect-timeout: 2000
            read-timeout: 3000
          customer-service:
            connect-timeout: 2000
            read-timeout: 3000
      # Every Feign call goes through a Resilience4j circuit breaker (no Feign
      # fallback: a dependency that is down gives a 503, never a fake success).
      circuitbreaker:
        enabled: true
        group:
          enabled: true
ticketflow:
  kafka:
    topics:
      booking-created: ticketflow.booking.created
# ONE breaker per Feign client. The names are the Feign client names: the app's
# FeignCircuitBreakerConfig makes the breaker id = client name (group mode alone
# still creates one breaker per METHOD, e.g. "EventClientgetEventLong").
# Check: GET /actuator/circuitbreakers on booking-service (internal port 8083).
resilience4j:
  circuitbreaker:
    configs:
      remote-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # Only technical failures count: connection refused / timeouts
        # (RetryableException), 5xx and "no instance" (ServiceUnavailableException,
        # from FeignErrorDecoder), time limiter timeouts.
        record-exceptions:
          - feign.RetryableException
          - com.ticketflow.bookingservice.exception.ServiceUnavailableException
          - java.util.concurrent.TimeoutException
        # Business answers never open the circuit (unknown event, DRAFT event,
        # not enough seats): neither failure nor success.
        ignore-exceptions:
          - com.ticketflow.bookingservice.exception.RemoteNotFoundException
          - com.ticketflow.bookingservice.exception.RemoteConflictException
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest
          - jakarta.validation.ValidationException
    instances:
      event-service:
        base-config: remote-service
      customer-service:
        base-config: remote-service
  timelimiter:
    configs:
      remote-service:
        # Above Feign's read-timeout (3000 ms): Feign's own timeout fires first.
        timeout-duration: 4s
    instances:
      event-service:
        base-config: remote-service
      customer-service:
        base-config: remote-service
management:
  endpoints:
    web:
      exposure:
        # booking-service's port is not published and the gateway routes only
        # /api/bookings/**: these endpoints are internal (docker compose exec).
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      # Shows components.circuitBreakers (state per dependency).
      show-details: always
