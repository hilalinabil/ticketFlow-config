server:
  port: 8082
  # Build links (Location header) from the Host forwarded by the gateway.
  forward-headers-strategy: framework
spring:
  datasource:
    # DB_HOST: "mysql" in docker compose, localhost otherwise.
    # Credentials come ONLY from the environment (root .env), never from this repo.
    url: jdbc:mysql://${DB_HOST:localhost}:3306/event_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info
