server:
  port: 8080
spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          # Forward the client's Host (e.g. localhost:8080) to the services, so
          # links they build (Location header) point to the gateway, not to the
          # container. Safer than trusting X-Forwarded-* headers from clients.
          default-filters:
            - PreserveHostHeader
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**
              filters:
                - AddResponseHeader=X-Served-By, api-gateway
            # Public event API only. /internal/** (booking-service -> event-service)
            # is deliberately NOT routed: no route matches it, so the gateway returns 404.
            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/api/events/**
              filters:
                - AddResponseHeader=X-Served-By, api-gateway
management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,info,gateway
